document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"9c317fb3-8473-476f-ad14-e567bb81c6bd\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"21f120a3-f013-487c-9364-76bbd5a16b64\") format('truetype');\n}\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"be524ad3-8567-45c5-9c24-29801def0d9e\") format('truetype');\n}\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4358cbea-655c-4db3-8184-f21b9b6919e6\") format('truetype');\n}\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"6140ddbe-b857-4b44-b9c5-ad882d80736d\") format('truetype');\n}\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f6683fdd-c3ea-4455-8426-927998ae1233\") format('truetype');\n}\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"cd13a560-29dd-4b35-bc96-3a7f099f4412\") format('truetype');\n}\n<\u002Fstyle>\n<style>\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n  body{font-family:'Nunito',system-ui,sans-serif}\n  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}\n  @keyframes flashWarm{0%,100%{background:rgba(217,138,95,0)}50%{background:rgba(217,138,95,.34)}}\n  @keyframes blinkTime{0%,100%{opacity:1}50%{opacity:.32}}\n  @keyframes popScale{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}\n  @keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(217,138,95,.0)}50%{box-shadow:0 0 0 10px rgba(217,138,95,.22)}}\n  @keyframes bellSwing{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(13deg)}}\n  @keyframes ripple{0%{transform:translate(-50%,-50%) scale(.35);opacity:.5}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}\n  @keyframes wavePulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}\n  @keyframes overlayIn{0%{opacity:0}100%{opacity:1}}\n  @keyframes titleBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,#f3e9da 0%,#e6dac8 60%,#ddcfba 100%);padding:32px\">\n\n  <div style=\"position:relative;width:472px;background:#fffaf3;border-radius:14px;box-shadow:0 24px 60px -18px rgba(92,64,40,.38),0 2px 0 0 rgba(255,255,255,.6) inset;overflow:hidden;border:1px solid #f0e4d3\">\n\n    <!-- title bar -->\n    <div style=\"height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 16px;background:#f7ecde;border-bottom:1px solid #efe2d0\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"width:11px;height:11px;border-radius:50%;background:#d98a5f;box-shadow:0 0 0 3px #f4ddcb\"><\u002Fdiv>\n        <span style=\"font-size:13px;font-weight:700;color:#5b4d3f;letter-spacing:.02em\">倒计时<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:2px\">\n        <div style=\"width:40px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:#9c8b76;cursor:default\" style-hover=\"background:#efe1cf\"><div style=\"width:11px;height:2px;background:currentColor;border-radius:2px\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"width:40px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:#9c8b76;cursor:default\" style-hover=\"background:#efe1cf\"><div style=\"width:10px;height:10px;border:1.6px solid currentColor;border-radius:2px\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"width:40px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:#9c8b76;font-size:16px;cursor:default\" style-hover=\"background:#e4654a;color:#fff\">✕<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- body -->\n    <div style=\"padding:30px 32px 32px\">\n\n      <!-- time display -->\n      <div style=\"text-align:center;margin-bottom:22px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:62px;line-height:1;letter-spacing:.02em;color:#3c332b;font-variant-numeric:tabular-nums\">{{ timeStr }}<\u002Fdiv>\n        <sc-if value=\"{{ showBar }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"height:6px;border-radius:99px;background:#efe3d4;margin-top:18px;overflow:hidden\">\n            <div style=\"height:100%;border-radius:99px;background:linear-gradient(90deg,#e2a279,#d98a5f);width:{{ pctStr }};transition:width .12s linear\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <!-- setup controls -->\n      <sc-if value=\"{{ showControls }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <!-- mode toggle -->\n          <div style=\"display:flex;justify-content:center;margin-bottom:20px\">\n            <div style=\"display:flex;gap:3px;background:#f4e9da;border-radius:10px;padding:3px\">\n              <button onclick=\"{{ setWheel }}\" style=\"border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;padding:7px 18px;border-radius:8px;background:{{ wheelBg }};color:{{ wheelColor }};box-shadow:{{ wheelShadow }}\">调节<\u002Fbutton>\n              <button onclick=\"{{ setText }}\" style=\"border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;padding:7px 18px;border-radius:8px;background:{{ textBg }};color:{{ textColor }};box-shadow:{{ textShadow }}\">输入<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- unit steppers -->\n          <div style=\"display:flex;justify-content:center;gap:14px;margin-bottom:22px\">\n            <sc-for list=\"{{ units }}\" as=\"item\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:9px;width:118px\">\n                <span style=\"font-size:12px;font-weight:700;color:#a8967f;letter-spacing:.08em\">{{ item.label }}<\u002Fspan>\n                <sc-if value=\"{{ item.wheel }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex;align-items:center;gap:6px;background:#fbf2e7;border:1px solid #eddcc8;border-radius:12px;padding:5px 6px;width:100%\">\n                    <button onclick=\"{{ item.dec }}\" style=\"border:none;background:#f1e3d2;color:#b07a52;width:30px;height:30px;border-radius:8px;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0\" style-hover=\"background:#ead2bb\">−<\u002Fbutton>\n                    <span style=\"flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;color:#3c332b\">{{ item.display }}<\u002Fspan>\n                    <button onclick=\"{{ item.inc }}\" style=\"border:none;background:#f1e3d2;color:#b07a52;width:30px;height:30px;border-radius:8px;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0\" style-hover=\"background:#ead2bb\">+<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ item.text }}\" hint-placeholder-val=\"{{ false }}\">\n                  <input type=\"number\" value=\"{{ item.value }}\" onchange=\"{{ item.onInput }}\" min=\"0\" style=\"width:100%;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;color:#3c332b;background:#fbf2e7;border:1px solid #eddcc8;border-radius:12px;padding:9px 4px;outline:none\" style-focus=\"border-color:#d98a5f\">\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <!-- presets -->\n          <div style=\"display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:26px\">\n            <sc-for list=\"{{ presets }}\" as=\"p\" hint-placeholder-count=\"5\">\n              <button onclick=\"{{ p.onClick }}\" style=\"border:1px solid {{ p.border }};cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;padding:7px 15px;border-radius:99px;background:{{ p.bg }};color:{{ p.color }}\">{{ p.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- action buttons -->\n      <div style=\"display:flex;gap:12px;margin-bottom:8px\">\n        <button onclick=\"{{ primaryAction }}\" disabled=\"{{ primaryDisabled }}\" style=\"flex:1;border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:17px;padding:15px;border-radius:13px;color:#fff;background:{{ primaryBg }};box-shadow:0 8px 18px -6px rgba(197,115,74,.55);opacity:{{ primaryOpacity }}\" style-hover=\"filter:brightness(1.05)\">{{ primaryLabel }}<\u002Fbutton>\n        <button onclick=\"{{ onReset }}\" disabled=\"{{ resetDisabled }}\" style=\"border:1px solid #e7d8c4;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;padding:15px 22px;border-radius:13px;color:#8a7763;background:#fbf3e8;opacity:{{ resetOpacity }}\" style-hover=\"background:#f3e7d6\">重置<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- music bar -->\n    <div style=\"display:flex;align-items:center;gap:11px;padding:14px 20px;background:#f7ecde;border-top:1px solid #efe2d0\">\n      <div style=\"width:34px;height:34px;border-radius:9px;background:#f0ddc9;display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n        <div style=\"width:7px;height:7px;border-radius:50%;background:#c5734a;box-shadow:9px -3px 0 -1px #c5734a\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:11px;font-weight:700;color:#a8967f;letter-spacing:.06em\">提醒音乐<\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:700;color:#5b4d3f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ musicLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"{{ preview }}\" style=\"border:1px solid #e7d8c4;background:#fffaf3;color:#9a8771;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;padding:7px 11px;border-radius:9px\" style-hover=\"background:#f3e7d6\">试听<\u002Fbutton>\n      <sc-if value=\"{{ hasMusic }}\" hint-placeholder-val=\"{{ false }}\">\n        <button onclick=\"{{ clearMusic }}\" style=\"border:1px solid #e7d8c4;background:#fffaf3;color:#9a8771;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;padding:7px 11px;border-radius:9px\" style-hover=\"background:#f3e7d6\">移除<\u002Fbutton>\n      <\u002Fsc-if>\n      <button onclick=\"{{ chooseMusic }}\" style=\"border:none;background:#d98a5f;color:#fff;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;padding:8px 13px;border-radius:9px\" style-hover=\"filter:brightness(1.05)\">选择音乐<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- finished overlay -->\n    <sc-if value=\"{{ finished }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#f9e7d5;animation:overlayIn .25s ease-out\">\n        <!-- pulsing warm flash tint -->\n        <div style=\"position:absolute;inset:0;pointer-events:none;animation:flashWarm 1.1s ease-in-out infinite\"><\u002Fdiv>\n        <!-- ripple rings -->\n        <div style=\"position:absolute;left:50%;top:42%;width:150px;height:150px;border-radius:50%;border:2px solid rgba(197,115,74,.6);animation:ripple 1.8s ease-out infinite\"><\u002Fdiv>\n        <div style=\"position:absolute;left:50%;top:42%;width:150px;height:150px;border-radius:50%;border:2px solid rgba(197,115,74,.6);animation:ripple 1.8s ease-out infinite;animation-delay:.6s\"><\u002Fdiv>\n        <div style=\"position:absolute;left:50%;top:42%;width:150px;height:150px;border-radius:50%;border:2px solid rgba(197,115,74,.6);animation:ripple 1.8s ease-out infinite;animation-delay:1.2s\"><\u002Fdiv>\n\n        <!-- bell with sound waves -->\n        <div style=\"position:relative;display:flex;align-items:center;gap:11px;z-index:1\">\n          <div style=\"position:relative;width:30px;height:30px\">\n            <div style=\"position:absolute;inset:0;width:30px;height:30px;border-radius:9px 9px 5px 5px;background:#c5734a;transform-origin:top center;animation:bellSwing .6s ease-in-out infinite\"><\u002Fdiv>\n            <div style=\"position:absolute;left:11px;bottom:-5px;width:8px;height:8px;border-radius:50%;background:#c5734a;animation:bellSwing .6s ease-in-out infinite\"><\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-size:19px;font-weight:800;color:#8a4e2c;letter-spacing:.14em;animation:titleBounce .9s ease-in-out infinite\">时间到了<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:58px;color:#b3582f;z-index:1;animation:blinkTime .9s ease-in-out infinite,popScale 1.1s ease-in-out infinite\">{{ timeStr }}<\u002Fdiv>\n\n        <button onclick=\"{{ stopFinished }}\" style=\"position:relative;z-index:1;border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:17px;padding:14px 48px;border-radius:13px;color:#fff;background:#c5734a;box-shadow:0 10px 26px -8px rgba(160,70,40,.7);animation:ringPulse 1.1s ease-in-out infinite\" style-hover=\"filter:brightness(1.06)\">停止<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    \n    <audio ref=\"{{ audioRef }}\"><\u002Faudio>\n    <input ref=\"{{ fileRef }}\" type=\"file\" accept=\"audio/*\" onchange=\"{{ onFile }}\" style=\"display:none\">\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.state={ h:0, m:5, s:0, running:false, remaining:null, finished:false, inputMode:'wheel', musicName:null };\n    this.audioRef=React.createRef();\n    this.fileRef=React.createRef();\n  }\n  componentDidMount(){\n    try{ const raw=localStorage.getItem('countdown_cfg'); if(raw){ const c=JSON.parse(raw); this.setState({h:c.h??0,m:c.m??5,s:c.s??0,inputMode:c.inputMode||'wheel'}); } }catch(e){}\n  }\n  componentWillUnmount(){ this.clearTimer(); this.stopBeep(); }\n  saveCfg(){ try{ const {h,m,s,inputMode}=this.state; localStorage.setItem('countdown_cfg',JSON.stringify({h,m,s,inputMode})); }catch(e){} }\n  clearTimer(){ if(this.timer){clearInterval(this.timer);this.timer=null;} }\n  configTotal(){ return this.state.h*3600+this.state.m*60+this.state.s; }\n  setUnit(key,val){ const max=key==='h'?99:59; val=Math.max(0,Math.min(max,Math.floor(val||0))); this.setState({[key]:val},()=>this.saveCfg()); }\n  resumeAudio(){ const c=this.actxGet(); if(c&&c.state==='suspended'){ c.resume().catch(()=>{}); } }\n  startOrResume(){\n    this.resumeAudio();\n    let rem=this.state.remaining;\n    if(rem==null||rem<=0){ rem=this.configTotal(); this.runTotal=rem; }\n    if(rem<=0) return;\n    if(!this.runTotal) this.runTotal=rem;\n    this.endTime=Date.now()+rem*1000;\n    this.setState({running:true,finished:false,remaining:rem});\n    this.clearTimer();\n    this.timer=setInterval(()=>this.tick(),100);\n  }\n  tick(){\n    const rem=(this.endTime-Date.now())/1000;\n    if(rem<=0){ this.clearTimer(); this.setState({remaining:0,running:false,finished:true}); this.playAlarm(); }\n    else { this.setState({remaining:rem}); }\n  }\n  pause(){ this.clearTimer(); const rem=Math.max(0,(this.endTime-Date.now())/1000); this.setState({running:false,remaining:rem}); }\n  reset(){ this.clearTimer(); this.stopAlarm(); this.runTotal=null; this.setState({running:false,remaining:null,finished:false}); }\n  primaryAction(){ if(this.state.running) this.pause(); else this.startOrResume(); }\n  setMode(mode){ this.setState({inputMode:mode},()=>this.saveCfg()); }\n  preset(min){ this.clearTimer(); this.stopAlarm(); this.runTotal=null; this.setState({h:0,m:min,s:0,running:false,remaining:null,finished:false},()=>this.saveCfg()); }\n\n  // music\n  chooseMusic(){ if(this.fileRef.current) this.fileRef.current.click(); }\n  onFile(e){\n    const f=e.target.files&&e.target.files[0]; if(!f)return;\n    if(this.musicUrl) URL.revokeObjectURL(this.musicUrl);\n    this.musicUrl=URL.createObjectURL(f);\n    const a=this.audioRef.current; if(a){ a.src=this.musicUrl; a.loop=true; }\n    this.setState({musicName:f.name});\n    e.target.value='';\n  }\n  clearMusic(){\n    if(this.musicUrl){ URL.revokeObjectURL(this.musicUrl); this.musicUrl=null; }\n    const a=this.audioRef.current; if(a){ a.pause(); a.removeAttribute('src'); }\n    this.setState({musicName:null});\n  }\n  preview(){\n    this.resumeAudio();\n    if(this.musicUrl){ const a=this.audioRef.current; if(a){ a.loop=false; a.currentTime=0; a.play().catch(()=>{}); setTimeout(()=>{ if(a){a.pause();a.loop=true;} },3500); } }\n    else { this.beepOnce(); }\n  }\n\n  // alarm sound\n  actxGet(){ if(!this.actx){ try{ this.actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return this.actx; }\n  beepOnce(){\n    const ctx=this.actxGet(); if(!ctx)return; const t=ctx.currentTime;\n    [0,0.2].forEach((off,i)=>{\n      const o=ctx.createOscillator(), g=ctx.createGain();\n      o.type='sine'; o.frequency.value=i?880:660;\n      o.connect(g); g.connect(ctx.destination);\n      g.gain.setValueAtTime(0.0001,t+off);\n      g.gain.exponentialRampToValueAtTime(0.35,t+off+0.02);\n      g.gain.exponentialRampToValueAtTime(0.0001,t+off+0.17);\n      o.start(t+off); o.stop(t+off+0.2);\n    });\n  }\n  playAlarm(){\n    if(this.musicUrl){ const a=this.audioRef.current; if(a){ a.loop=true; a.currentTime=0; a.play().catch(()=>{}); } }\n    else { this.beepOnce(); this.beepTimer=setInterval(()=>this.beepOnce(),1000); }\n  }\n  stopBeep(){ if(this.beepTimer){ clearInterval(this.beepTimer); this.beepTimer=null; } }\n  stopAlarm(){ this.stopBeep(); const a=this.audioRef.current; if(a) a.pause(); }\n  stopFinished(){ this.stopAlarm(); this.reset(); }\n\n  pad(n){ n=Math.floor(n); return (n<10?'0':'')+n; }\n\n  renderVals(){\n    const st=this.state;\n    const idle = !st.running && st.remaining==null;\n    const totalSec = st.remaining!=null ? Math.max(0,Math.ceil(st.remaining)) : this.configTotal();\n    const dh=Math.floor(totalSec/3600), dm=Math.floor(totalSec%3600/60), ds=totalSec%60;\n    const wheel = idle && st.inputMode==='wheel';\n    const text = idle && st.inputMode==='text';\n    const seg=(active)=>active?'#fffaf3':'transparent';\n    const mk=(key,label,val)=>({\n      label, value:val, display:this.pad(val), wheel, text,\n      inc:()=>this.setUnit(key,this.state[key]+1),\n      dec:()=>this.setUnit(key,this.state[key]-1),\n      onInput:(e)=>this.setUnit(key,parseInt(e.target.value,10)),\n    });\n    const units=[ mk('h','时',st.h), mk('m','分',st.m), mk('s','秒',st.s) ];\n    const presets=[1,5,10,25,45].map(min=>{\n      const active=idle&&st.h===0&&st.m===min&&st.s===0;\n      return { label:min+'分', onClick:()=>this.preset(min),\n        bg:active?'#f3ddc9':'#fbf3e8', color:active?'#a85c34':'#8a7763', border:active?'#e3b893':'#ecdcc8' };\n    });\n    const showBar = st.remaining!=null && !st.finished;\n    const pct = showBar && this.runTotal ? Math.max(0,Math.min(1,totalSec/this.runTotal))*100 : 0;\n    return {\n      timeStr: this.pad(dh)+':'+this.pad(dm)+':'+this.pad(ds),\n      units, presets,\n      showControls: idle, finished: st.finished,\n      showBar, pctStr: pct.toFixed(1)+'%',\n      primaryLabel: st.running?'暂停':(st.remaining!=null?'继续':'开始'),\n      primaryAction:()=>this.primaryAction(),\n      primaryDisabled: idle && this.configTotal()===0,\n      primaryBg: idle&&this.configTotal()===0 ? '#d8c3ad' : '#d98a5f',\n      primaryOpacity: idle&&this.configTotal()===0 ? 0.7 : 1,\n      onReset:()=>this.reset(), resetDisabled: idle, resetOpacity: idle?0.45:1,\n      setWheel:()=>this.setMode('wheel'), setText:()=>this.setMode('text'),\n      wheelBg:seg(st.inputMode==='wheel'), wheelColor:st.inputMode==='wheel'?'#a85c34':'#9a8771', wheelShadow:st.inputMode==='wheel'?'0 1px 3px rgba(120,80,50,.18)':'none',\n      textBg:seg(st.inputMode==='text'), textColor:st.inputMode==='text'?'#a85c34':'#9a8771', textShadow:st.inputMode==='text'?'0 1px 3px rgba(120,80,50,.18)':'none',\n      musicLabel: st.musicName || '默认提示音', hasMusic: !!st.musicName,\n      chooseMusic:()=>this.chooseMusic(), clearMusic:()=>this.clearMusic(), preview:()=>this.preview(), onFile:(e)=>this.onFile(e),\n      stopFinished:()=>this.stopFinished(),\n      audioRef:this.audioRef, fileRef:this.fileRef,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
